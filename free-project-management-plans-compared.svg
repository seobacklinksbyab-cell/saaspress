<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Free project management plans compared</title>
  <desc id="d">Key limits of the free plans of Trello, Asana, ClickUp, Notion and monday.com, checked on official pricing pages on 24 October 2026.</desc>
  <rect width="1200" height="630" fill="#12203A"/>
  <text x="60" y="95" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">Free project management plans</text>
  <text x="60" y="140" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#C9D6F2">What each free plan really includes</text>

  <!-- Trello -->
  <rect x="60" y="180" width="200" height="340" rx="14" fill="#FFFFFF"/>
  <rect x="60" y="180" width="200" height="10" rx="5" fill="#2456E8"/>
  <text x="160" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#12203A">Trello</text>
  <text x="160" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2456E8">10 collaborators</text>
  <text x="160" y="375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#12203A">10 boards</text>
  <text x="160" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#12203A">10 MB per file</text>

  <!-- Asana -->
  <rect x="280" y="180" width="200" height="340" rx="14" fill="#FFFFFF"/>
  <rect x="280" y="180" width="200" height="10" rx="5" fill="#2456E8"/>
  <text x="380" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#12203A">Asana</text>
  <text x="380" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2456E8">2 users</text>
  <text x="380" y="375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#12203A">Unlimited tasks</text>
  <text x="380" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#12203A">100 MB per file</text>

  <!-- ClickUp -->
  <rect x="500" y="180" width="200" height="340" rx="14" fill="#FFFFFF"/>
  <rect x="500" y="180" width="200" height="10" rx="5" fill="#2456E8"/>
  <text x="600" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#12203A">ClickUp</text>
  <text x="600" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2456E8">Unlimited members</text>
  <text x="600" y="375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#12203A">60 MB storage</text>
  <text x="600" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#12203A">1 form</text>

  <!-- Notion -->
  <rect x="720" y="180" width="200" height="340" rx="14" fill="#FFFFFF"/>
  <rect x="720" y="180" width="200" height="10" rx="5" fill="#2456E8"/>
  <text x="820" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#12203A">Notion</text>
  <text x="820" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2456E8">Built for solo use</text>
  <text x="820" y="375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#12203A">5 MB per file</text>
  <text x="820" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#12203A">7 days of history</text>

  <!-- monday.com -->
  <rect x="940" y="180" width="200" height="340" rx="14" fill="#FFFFFF"/>
  <rect x="940" y="180" width="200" height="10" rx="5" fill="#2456E8"/>
  <text x="1040" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#12203A">monday.com</text>
  <text x="1040" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2456E8">2 seats</text>
  <text x="1040" y="375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#12203A">3 boards</text>
  <text x="1040" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#12203A">3 Docs</text>

  <text x="60" y="578" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C9D6F2">Checked on each tool's official pricing page, 24 October 2026. Plans change, so confirm before you commit.</text>
  <text x="1140" y="610" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">SaaS<tspan fill="#7FA2FF">Press</tspan></text>
</svg>
